version: 2
models:
  - name: posts_questions
    description: Staging table copying questions from StackOverflow
    config:
      alias: posts_questions
      meta:
        domain: questions
        layer: silver
        owner: data-team
        version: '1.0'
      tags: [job, silver, questions]
    columns:
      - name: owner_display_name
        description: Display name of the user who posted the question
        data_type: STRING
      - name: tags
        description: Tags associated with the question
        data_type: STRING
      - name: view_count
        description: Number of times the question was viewed
        data_type: INT64
      - name: community_owned_date
        description: Timestamp when the question became community-owned
        data_type: TIMESTAMP
      - name: creation_date
        description: Timestamp when the question was created
        data_type: TIMESTAMP
      - name: favorite_count
        description: Number of times the question was favorited
        data_type: INT64
      - name: last_activity_date
        description: Timestamp of the last activity on this question
        data_type: TIMESTAMP
      - name: owner_user_id
        description: ID of the user who posted the question
        data_type: INT64
      - name: parent_id
        data_type: STRING
      - name: post_type_id
        description: Type of post (question type)
        data_type: INT64
      - name: score
        description: Score of the question (upvotes minus downvotes)
        data_type: INT64
      - name: title
        description: Title of the question
        data_type: STRING
      - name: body
        description: Body content of the question
        data_type: STRING
      - name: accepted_answer_id
        description: ID of the accepted answer
        data_type: INT64
      - name: answer_count
        description: Number of answers to the question
        data_type: INT64
      - name: comment_count
        description: Number of comments on the question
        data_type: INT64
      - name: last_edit_date
        description: Timestamp of the last edit
        data_type: TIMESTAMP
      - name: id
        description: Unique identifier of the question
        tests:
          - not_null
          - unique
        data_type: INT64
      - name: last_editor_display_name
        description: Display name of the last editor
        data_type: STRING
      - name: last_editor_user_id
        description: User ID of the last editor
        data_type: INT64
  - name: votes
    description: Staging table copying votes from StackOverflow
    config:
      alias: votes
      meta:
        domain: votes
        layer: silver
        owner: data-team
        version: '1.0'
      tags: [job, silver, votes]
    columns:
      - name: id
        description: Unique identifier of the vote
        tests:
          - not_null
          - unique
        data_type: INT64
      - name: creation_date
        description: Timestamp when the vote was created
        data_type: TIMESTAMP
      - name: post_id
        description: ID of the post that was voted on
        tests:
          - not_null
        data_type: INT64
      - name: vote_type_id
        description: Type of vote (e.g. 2=upvote, 3=downvote)
        data_type: INT64
  - name: posts_answers
    description: Staging table copying answers from StackOverflow
    config:
      alias: posts_answers
      contract:
        enforced: true
      meta:
        domain: answers
        layer: silver
        owner: data-team
        version: '1.0'
        tags:
          - tag_key: PII
            tag_value: public
          - tag_key: classification
            tag_value: non_sensitive

    tags: [job, silver, answers]
    columns:
      - name: last_edit_date
        description: Timestamp of the last edit
        data_type: TIMESTAMP
      - name: last_editor_display_name
        description: Display name of the last editor
        data_type: STRING
      - name: last_editor_user_id
        description: User ID of the last editor
        data_type: INT64
      - name: owner_display_name
        description: Display name of the user who posted the answer
        data_type: STRING
      - name: title
        description: Title of the answer
        data_type: STRING
      - name: body
        description: Body content of the answer
        data_type: STRING
      - name: accepted_answer_id
        description: ID of the accepted answer
        data_type: STRING
      - name: owner_user_id
        description: ID of the user who posted the answer
        data_type: INT64
      - name: parent_id
        description: ID of the parent question
        data_type: INT64
      - name: post_type_id
        description: Type of post (answer type)
        data_type: INT64
      - name: id
        description: Unique identifier of the answer
        tests:
          - not_null
        data_type: INT64
        constraints:
          - type: not_null
      - name: score
        description: Score of the answer (upvotes minus downvotes)
        data_type: INT64
      - name: answer_count
        description: Number of answers (if applicable)
        data_type: STRING
      - name: comment_count
        description: Number of comments on the answer
        data_type: INT64
      - name: community_owned_date
        description: Timestamp when the answer became community-owned
        data_type: TIMESTAMP
      - name: creation_date
        description: Timestamp when the answer was created
        data_type: TIMESTAMP
      - name: favorite_count
        description: Number of times this answer was favorited
        data_type: STRING
      - name: last_activity_date
        description: Timestamp of the last activity on this answer
        data_type: TIMESTAMP
      - name: tags
        description: Tags associated with the answer
        data_type: STRING
      - name: view_count
        description: Number of times the answer was viewed
        data_type: STRING
  - name: filtered_questions
    description: "Dataset: questions tagged 'etl', creation date > 2021-01-01"
    config:
      alias: filtered_questions
      meta:
        domain: questions
        layer: silver
        owner: data-team
        version: '1.0'
      tags: [dataset, silver, questions]
    columns:
      - name: answer_count
        description: Número de respuestas
        data_type: INT64
      - name: owner_user_id
        description: ID del usuario propietario
        tests:
          - not_null
        data_type: INT64
      - name: parent_id
        data_type: STRING
      - name: comment_count
        description: Número de comentarios
        data_type: INT64
      - name: community_owned_date
        description: Fecha de propiedad comunitaria
        data_type: TIMESTAMP
      - name: post_type_id
        description: Tipo de post
        data_type: INT64
      - name: creation_date
        description: Fecha de creación
        tests:
          - not_null
        data_type: TIMESTAMP
      - name: score
        description: Puntuación del post
        data_type: INT64
      - name: tags
        description: Etiquetas del post
        data_type: STRING
      - name: favorite_count
        description: Número de favoritos
        data_type: INT64
      - name: last_activity_date
        description: Fecha de última actividad
        data_type: TIMESTAMP
      - name: last_edit_date
        description: Fecha de última edición
        data_type: TIMESTAMP
      - name: id
        description: ID del post
        tests:
          - not_null
          - unique
        data_type: INT64
      - name: title
        description: Título del post
        data_type: STRING
      - name: last_editor_display_name
        description: Nombre del último editor
        data_type: STRING
      - name: last_editor_user_id
        description: ID del último editor
        data_type: INT64
      - name: owner_display_name
        description: Nombre del propietario
        data_type: STRING
      - name: view_count
        description: Número de vistas
        data_type: INT64
      - name: body
        description: Contenido del post
        data_type: STRING
      - name: accepted_answer_id
        description: ID de la respuesta aceptada
        data_type: INT64
  - name: filtered_answers
    description: 'Dataset: answers related to filtered questions'
    config:
      alias: filtered_answers
      meta:
        domain: answers
        layer: silver
        owner: data-team
        version: '1.0'
      tags: [dataset, silver, answers, filtered]
    columns:
      - name: comment_count
        description: Número de comentarios
        data_type: INT64
      - name: view_count
        description: Número de vistas
        data_type: STRING
      - name: post_type_id
        description: Tipo de post
        data_type: INT64
      - name: accepted_answer_id
        description: ID de la respuesta aceptada
        data_type: STRING
      - name: body
        description: Contenido del post
        data_type: STRING
      - name: favorite_count
        description: Número de favoritos
        data_type: STRING
      - name: id
        description: ID del post
        tests:
          - unique
          - not_null
        data_type: INT64
      - name: last_activity_date
        description: Fecha de última actividad
        data_type: TIMESTAMP
      - name: owner_user_id
        description: ID del usuario propietario
        tests:
          - not_null
        data_type: INT64
      - name: last_editor_user_id
        description: ID del último editor
        data_type: INT64
      - name: last_editor_display_name
        description: Nombre del último editor
        data_type: STRING
      - name: title
        description: Título del post
        data_type: STRING
      - name: owner_display_name
        description: Nombre del propietario
        data_type: STRING
      - name: tags
        description: Etiquetas del post
        data_type: STRING
      - name: answer_count
        description: Número de respuestas
        data_type: STRING
      - name: community_owned_date
        description: Fecha de propiedad comunitaria
        data_type: TIMESTAMP
      - name: last_edit_date
        description: Fecha de última edición
        data_type: TIMESTAMP
      - name: parent_id
        description: ID del post padre
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('filtered_questions')
                field: id
        data_type: INT64
      - name: score
        description: Puntuación del post
        data_type: INT64
      - name: creation_date
        description: Fecha de creación
        tests:
          - not_null
        data_type: TIMESTAMP
  - name: filtered_votes
    description: 'Dataset: votes related to filtered questions'
    config:
      alias: filtered_votes
      meta:
        domain: votes
        layer: silver
        owner: data-team
        version: '1.0'
      tags: [dataset, silver, votes, filtered]
    columns:
      - name: id
        description: ID del voto
        tests:
          - not_null
          - unique
        data_type: INT64
      - name: post_id
        description: ID del post votado
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('filtered_questions')
                field: id
        data_type: INT64
      - name: creation_date
        description: Fecha de creación del voto
        data_type: TIMESTAMP
      - name: vote_type_id
        description: Tipo de voto
        data_type: INT64
  - name: summary_daily
    description: 'Dataset: daily aggregated summary of questions, answers and unique
      askers/answerers'
    config:
      alias: summary_daily
      meta:
        domain: questions
        layer: gold
        owner: data-team
        version: '1.0'
      tags: [dataset, gold, summary, daily]
    columns:
      - name: date
        description: Fecha de agregación diaria
        tests:
          - not_null
          - unique
        data_type: DATE
      - name: num_questions
        description: Número total de preguntas ese día
        data_type: INT64
      - name: num_answers
        description: Número total de respuestas ese día
        data_type: INT64
      - name: num_askers
        description: Número de usuarios que hicieron preguntas ese día
        data_type: INT64
      - name: num_answerers
        description: Número de usuarios que respondieron preguntas ese día
        data_type: INT64
  - name: question_stats
    description: 'Dataset: aggregated statistics for filtered questions including
      votes'
    config:
      alias: question_stats
      meta:
        domain: questions
        layer: gold
        owner: data-team
        version: '1.0'
      tags: [dataset, gold, questions, stats, view]
    columns:
      - name: id
        description: ID de la pregunta
        data_type: INT64
      - name: owner_user_id
        description: ID del usuario propietario
        data_type: INT64
      - name: accepted_answer_id
        description: ID de la respuesta aceptada
        data_type: INT64
      - name: answer_count
        description: Número total de respuestas
        data_type: INT64
      - name: upvote_count
        description: Número total de votos positivos
        data_type: INT64
      - name: downvote_count
        description: Número total de votos negativos
        data_type: INT64
    tests:
      - dbt_utils.expression_is_true:
          expression: total_questions >= 0
      - dbt_utils.expression_is_true:
          expression: total_votes >= 0
  - name: answer_stats
    description: 'Job: calculates upvote and downvote counts for each answer'
    config:
      alias: answer_stats
      meta:
        domain: answers
        layer: silver
        owner: data-team
        version: '1.0'
      tags: [job, silver, answers, stats]
    columns:
      - name: id
        description: ID de la respuesta
        data_type: INT64
      - name: owner_user_id
        description: ID del usuario que respondió
        data_type: INT64
      - name: upvote_count
        description: Número total de votos positivos
        data_type: INT64
      - name: downvote_count
        description: Número total de votos negativos
        data_type: INT64
